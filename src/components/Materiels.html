<!-- ================= SECTION MATÉRIEL ================= -->
<section id="materiels" class="bg-black py-8 sm:py-14 md:py-16 border-t border-zinc-900">

    <div class="mx-auto max-w-[1500px] px-3 sm:px-6">

        <!-- Header Compact -->
        <div class="text-center max-w-xl mx-auto">
            <span class="rounded-full bg-yellow-500/10 px-3.5 py-1 text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-[#F5C400]">
                Notre Matériel
            </span>

            <h2 class="mt-2 sm:mt-3 text-xl sm:text-3xl md:text-4xl font-black text-white">
                Catalogue professionnel
            </h2>

            <p class="mt-1 sm:mt-2 text-xs sm:text-sm text-zinc-400">
                Trouvez rapidement le matériel adapté à votre configuration.
            </p>
        </div>

        <!-- Niveau 1 : Commutateur Environnement (Indoor / Outdoor / Tous) -->
        <div class="mx-auto mt-5 flex max-w-sm items-center justify-center rounded-2xl border border-zinc-800 bg-zinc-900/90 p-1 backdrop-blur-sm">
            <button data-env="Tous" class="env-btn flex-1 rounded-xl bg-[#F5C400] py-2 text-xs font-bold text-black transition">
                Tous
            </button>
            <button data-env="Indoor" class="env-btn flex-1 rounded-xl py-2 text-xs font-medium text-zinc-400 transition hover:text-white">
                🏛️ Indoor
            </button>
            <button data-env="Outdoor" class="env-btn flex-1 rounded-xl py-2 text-xs font-medium text-zinc-400 transition hover:text-white">
                🌿 Outdoor
            </button>
        </div>

        <!-- Search Réduit -->
        <div class="mx-auto mt-4 sm:mt-5 max-w-xl">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-zinc-500"></i>
                <input
                    id="search-material"
                    type="text"
                    placeholder="Rechercher un matériel (ex: RCF, Lyre, Écran...)"
                    class="w-full rounded-xl border border-zinc-800 bg-zinc-900/90 py-2 sm:py-2.5 pl-10 pr-3 text-xs sm:text-sm text-white outline-none transition focus:border-[#F5C400]">
            </div>
        </div>

        <!-- Niveau 2 : Sous-catégories en barre horizontale tactile pour MOBILE -->
        <div class="mt-3 flex gap-1.5 overflow-x-auto pb-1.5 pt-1 lg:hidden no-scrollbar">
            <button data-category="Tous" class="category-btn flex-none rounded-lg bg-[#F5C400] px-3 py-1.5 text-[11px] font-bold text-black">
                📦 Tous
            </button>
            <button data-category="Son" class="category-btn flex-none rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-[11px] font-medium text-zinc-300">
                🔊 Son
            </button>
            <button data-category="Lumière" class="category-btn flex-none rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-[11px] font-medium text-zinc-300">
                💡 Lumière
            </button>
            <button data-category="LED" class="category-btn flex-none rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-[11px] font-medium text-zinc-300">
                📺 Écrans LED
            </button>
            <button data-category="DJ" class="category-btn flex-none rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-[11px] font-medium text-zinc-300">
                🎧 Matériel DJ
            </button>
            <button data-category="Structure" class="category-btn flex-none rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-[11px] font-medium text-zinc-300">
                🏗️ Structures
            </button>
        </div>

        <!-- Layout Desktop & Résultats -->
        <div class="mt-4 sm:mt-8 grid gap-6 lg:grid-cols-[220px_1fr]">

            <!-- Sidebar DESKTOP -->
            <aside class="hidden lg:block h-fit rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 sticky top-24">
                <h3 class="mb-3 text-xs font-bold uppercase tracking-wider text-zinc-400">Sous-catégories</h3>

                <div id="categories-sidebar" class="space-y-1.5">
                    <button data-category="Tous" class="category-btn flex w-full items-center gap-2.5 rounded-lg bg-[#F5C400] px-3 py-2 text-left text-xs font-bold text-black">
                        📦 Tous
                    </button>
                    <button data-category="Son" class="category-btn flex w-full items-center gap-2.5 rounded-lg bg-zinc-800/80 px-3 py-2 text-left text-xs text-white transition hover:bg-zinc-700">
                        🔊 Son
                    </button>
                    <button data-category="Lumière" class="category-btn flex w-full items-center gap-2.5 rounded-lg bg-zinc-800/80 px-3 py-2 text-left text-xs text-white transition hover:bg-zinc-700">
                        💡 Lumière
                    </button>
                    <button data-category="LED" class="category-btn flex w-full items-center gap-2.5 rounded-lg bg-zinc-800/80 px-3 py-2 text-left text-xs text-white transition hover:bg-zinc-700">
                        📺 Écrans LED
                    </button>
                    <button data-category="DJ" class="category-btn flex w-full items-center gap-2.5 rounded-lg bg-zinc-800/80 px-3 py-2 text-left text-xs text-white transition hover:bg-zinc-700">
                        🎧 Matériel DJ
                    </button>
                    <button data-category="Structure" class="category-btn flex w-full items-center gap-2.5 rounded-lg bg-zinc-800/80 px-3 py-2 text-left text-xs text-white transition hover:bg-zinc-700">
                        🏗️ Structures
                    </button>
                </div>
            </aside>

            <!-- Contenu Matériels -->
            <div>
                <div class="mb-3 flex items-center justify-between">
                    <div>
                        <h3 id="category-title" class="text-sm sm:text-lg font-black text-white">
                            Tous les matériels
                        </h3>
                        <span id="active-env-badge" class="text-[10px] text-[#F5C400] font-semibold">
                            Tous environnements
                        </span>
                    </div>
                    <p id="results-count" class="text-[11px] text-zinc-400">
                        0 matériel
                    </p>
                </div>

                <!-- Grille 2 colonnes Mobile, 3-4 Desktop -->
                <div id="materiels-container" class="grid grid-cols-2 gap-2 sm:gap-3.5 lg:grid-cols-3 xl:grid-cols-4">
                    <!-- Les cartes injectées via JS apparaîtront ici -->
                </div>
            </div>

        </div>

    </div>

</section>
