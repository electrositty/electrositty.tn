<style>
    /* ================= CATALOGUE ================= */
    .ct-panel {
        background: linear-gradient(150deg, rgba(24, 24, 27, .8), rgba(9, 9, 11, .9));
        border: 1px solid rgba(255, 255, 255, .07);
    }

    /* Catégories */
    .ct-cat {
        position: relative; display: flex; align-items: center; gap: 12px; width: 100%;
        padding: 12px; border-radius: 16px; text-align: left;
        background: rgba(39, 39, 42, .35); border: 1px solid rgba(255, 255, 255, .05);
        transition: background .25s, border-color .25s, transform .25s;
    }
    .ct-cat:hover { border-color: rgba(245, 196, 0, .3); transform: translateX(3px); }
    .ct-cat.on { background: rgba(245, 196, 0, .1); border-color: rgba(245, 196, 0, .5); }
    .ct-cat-ico {
        flex: none; display: flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; border-radius: 12px; font-size: 16px;
        color: #a1a1aa; background: #18181b; border: 1px solid #27272a; transition: all .25s;
    }
    .ct-cat.on .ct-cat-ico { color: #F5C400; background: rgba(245, 196, 0, .14); border-color: rgba(245, 196, 0, .45); }
    .ct-count {
        margin-left: auto; min-width: 26px; padding: 2px 8px; border-radius: 999px; text-align: center;
        font-size: 11px; font-weight: 800; color: #a1a1aa; background: #18181b;
    }
    .ct-cat.on .ct-count { color: #000; background: #F5C400; }

    /* Environnement */
    .ct-env { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 14px; background: #111113; border: 1px solid #27272a; }
    .ct-env button { padding: 7px 0; border-radius: 10px; font-size: 11px; font-weight: 700; color: #a1a1aa; transition: all .25s; }
    .ct-env button.on { color: #F5C400; background: rgba(245, 196, 0, .14); box-shadow: inset 0 0 0 1px rgba(245, 196, 0, .4); }

    /* Recherche */
    .ct-search {
        width: 100%; padding: 10px 12px 10px 36px; border-radius: 14px; font-size: 13px; color: #fff;
        background: #111113; border: 1px solid #27272a; outline: none; transition: border-color .25s, box-shadow .25s;
    }
    .ct-search:focus { border-color: #F5C400; box-shadow: 0 0 0 3px rgba(245, 196, 0, .12); }

    /* Équipements */
    .ct-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .ct-item {
        position: relative; display: flex; gap: 14px; padding: 12px; border-radius: 18px;
        background: rgba(24, 24, 27, .7); border: 1px solid rgba(255, 255, 255, .06);
        transition: border-color .3s, background .3s, transform .3s;
        animation: ctIn .5s cubic-bezier(.2, .7, .2, 1) backwards;
        animation-delay: calc(var(--i, 0) * 60ms);
    }
    .ct-item:hover { border-color: rgba(245, 196, 0, .35); transform: translateY(-2px); }
    .ct-item.picked { border-color: rgba(245, 196, 0, .6); background: rgba(245, 196, 0, .06); }
    @keyframes ctIn { from { opacity: 0; transform: translateY(16px) scale(.98); } }

    .ct-thumb { position: relative; flex: none; width: 108px; height: 108px; border-radius: 14px; overflow: hidden; background: #18181b; }
    .ct-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
    .ct-item:hover .ct-thumb img { transform: scale(1.08); }
    .ct-thumb .ct-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #3f3f46; }

    .ct-badge {
        display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 800;
        text-transform: uppercase; letter-spacing: .05em; color: #F5C400;
        background: rgba(245, 196, 0, .1); border: 1px solid rgba(245, 196, 0, .3);
    }
    .ct-name { margin-top: 5px; font-size: 14px; font-weight: 800; line-height: 1.25; color: #fff; }
    .ct-desc {
        margin-top: 3px; font-size: 11.5px; line-height: 1.45; color: #a1a1aa;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .ct-meta { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px; }
    .ct-envchip { font-size: 10px; color: #71717a; }
    .ct-price { font-size: 11px; font-weight: 700; color: #d4d4d8; }
    .ct-add {
        margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px;
        font-size: 11px; font-weight: 800; color: #F5C400;
        background: rgba(245, 196, 0, .12); border: 1px solid rgba(245, 196, 0, .4);
        transition: background .25s, transform .2s;
    }
    .ct-add:hover { background: rgba(245, 196, 0, .25); }
    .ct-add:active { transform: scale(.93); }
    .ct-item.picked .ct-add { color: #000; background: #F5C400; }

    /* Barre de sélection */
    .ct-bar {
        display: none; align-items: center; gap: 12px; flex-wrap: wrap;
        margin-top: 14px; padding: 12px 14px; border-radius: 16px;
        background: rgba(245, 196, 0, .08); border: 1px solid rgba(245, 196, 0, .4);
        animation: ctIn .4s ease;
    }
    .ct-bar.show { display: flex; }

    @media (max-width: 1023px) {
        /* Mobile / tablette : catégories en ligne + équipements qui défilent horizontalement */
        .ct-cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .ct-cats::-webkit-scrollbar { display: none; }
        .ct-cat { width: auto; flex: none; padding: 8px 12px 8px 8px; gap: 8px; }
        .ct-cat:hover { transform: none; }
        .ct-cat-ico { width: 30px; height: 30px; font-size: 13px; border-radius: 9px; }
        .ct-cat-sub { display: none; }
        .ct-grid {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px;
            padding-bottom: 6px; scrollbar-width: none;
        }
        .ct-grid::-webkit-scrollbar { display: none; }
        .ct-item { flex: none; width: 82%; max-width: 360px; scroll-snap-align: start; }
    }
    @media (max-width: 480px) {
        .ct-thumb { width: 88px; height: 88px; }
        .ct-name { font-size: 13px; }
    }
</style>

<!-- ================= SECTION MATÉRIEL ================= -->
<section class="border-t border-zinc-900 bg-black py-10 sm:py-14 md:py-16">
    <div class="mx-auto max-w-6xl px-3 sm:px-6">

        <!-- En-tête -->
        <div class="mx-auto max-w-xl text-center">
            <span class="rounded-full bg-yellow-500/10 px-3.5 py-1 text-[11px] font-semibold uppercase tracking-wider text-[#F5C400] sm:text-xs">
                Notre Matériel
            </span>
            <h2 class="mt-2 text-xl font-black text-white sm:mt-3 sm:text-3xl md:text-4xl">
                Catalogue <span class="text-[#F5C400]">professionnel</span>
            </h2>
            <p class="mt-1 text-xs text-zinc-400 sm:mt-2 sm:text-sm">
                Choisissez une catégorie, ajoutez ce qu'il vous faut, et envoyez votre liste en un clic.
            </p>
        </div>

        <!-- ============ CATALOGUE ============ -->
        <div data-catalogue class="ct-panel mt-6 rounded-3xl p-3 sm:mt-8 sm:p-5">
            <div class="grid gap-4 lg:grid-cols-[250px_1fr] lg:gap-6">

                <!-- Colonne gauche : catégories + filtres -->
                <aside class="flex flex-col gap-3">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-zinc-500"></i>
                        <input type="search" data-ct-search class="ct-search" placeholder="Rechercher (micro, beam, écran…)" aria-label="Rechercher un matériel">
                    </div>
                    <div class="ct-cats flex flex-col gap-2" data-ct-cats></div>
                    <div class="ct-env" data-ct-env>
                        <button type="button" data-ct-env-val="Tous" class="on">Tous</button>
                        <button type="button" data-ct-env-val="Indoor">🏛️ Indoor</button>
                        <button type="button" data-ct-env-val="Outdoor">🌿 Outdoor</button>
                    </div>
                </aside>

                <!-- Colonne droite : équipements -->
                <div class="min-w-0">
                    <div class="mb-3 flex items-end justify-between gap-3">
                        <div>
                            <h3 data-ct-title class="text-base font-black text-white sm:text-lg">Son</h3>
                            <p data-ct-subtitle class="text-[11px] text-zinc-500"></p>
                        </div>
                        <span data-ct-count class="flex-none text-[11px] text-zinc-400"></span>
                    </div>
                    <div class="ct-grid" data-ct-grid></div>
                    <p class="mt-2 text-center text-[10px] text-zinc-600 lg:hidden">Glissez pour voir les autres →</p>

                    <!-- Sélection du client -->
                    <div class="ct-bar" data-ct-bar>
                        <span class="flex h-9 w-9 flex-none items-center justify-center rounded-xl bg-[#F5C400]/15 text-[#F5C400]">
                            <i class="fa-solid fa-clipboard-check"></i>
                        </span>
                        <div class="min-w-0 flex-1">
                            <p class="text-xs font-bold text-white" data-ct-bar-count></p>
                            <p class="truncate text-[11px] text-zinc-400" data-ct-bar-list></p>
                        </div>
                        <button type="button" data-ct-clear class="text-[11px] text-zinc-500 transition hover:text-white">Vider</button>
                        <a href="#contact" data-pack="Sélection catalogue" data-toast="Votre liste a été ajoutée au formulaire ✔" data-ct-send
                           class="inline-flex items-center gap-2 rounded-full border border-[#F5C400]/40 bg-[#F5C400]/15 px-4 py-2 text-xs font-bold text-[#F5C400] backdrop-blur-md transition hover:border-[#F5C400]/70 hover:bg-[#F5C400]/30">
                            Demander un devis <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Anciens éléments gardés invisibles pour que app.js continue de fonctionner sans erreur -->
    <div hidden aria-hidden="true">
        <button data-env="Tous" class="env-btn"></button><button data-env="Indoor" class="env-btn"></button><button data-env="Outdoor" class="env-btn"></button>
        <input id="search-material" type="text">
        <div id="categories-sidebar">
            <button data-category="Tous" class="category-btn"></button><button data-category="Son" class="category-btn"></button>
            <button data-category="Lumière" class="category-btn"></button><button data-category="LED" class="category-btn"></button>
            <button data-category="DJ" class="category-btn"></button>
        </div>
        <h3 id="category-title"></h3><span id="active-env-badge"></span><p id="results-count"></p>
        <div id="materiels-container"></div>
    </div>
</section>
