<!-- =======================================================
FEATURED PRODUCTIONS
======================================================= -->

<section id="featured-productions" class="bg-black py-24">

    <div class="max-w-7xl mx-auto px-6">

        <!-- Heading -->

        <div class="text-center mb-16">

            <span class="uppercase tracking-[5px] text-[#F5C400] text-sm font-semibold">
                Featured Productions
            </span>

            <h2 class="mt-4 text-4xl md:text-6xl font-black text-white">
                The Projects That Define ElectroSitty
            </h2>

       

        </div>

        <!-- =========================
             DESKTOP
        ========================== -->

        <div
            id="featuredDesktop"
            class="hidden lg:grid grid-cols-4 gap-6">

        </div>

        <!-- =========================
             MOBILE
        ========================== -->

        <div
            id="featuredMobile"
            class="flex flex-col gap-4 lg:hidden">

        </div>

    </div>

</section>
<!-- =======================================================
EVENTS
======================================================= -->

<section id="events" class="bg-[#080808] py-24">

    <div class="max-w-7xl mx-auto px-6">

        <div class="flex items-end justify-between mb-12">

            <div>

                <span class="uppercase tracking-[5px] text-[#F5C400] text-sm font-semibold">

                    Events

                </span>

                <h2 class="mt-3 text-5xl font-black text-white">

                    Conferences, Festivals & Universities

                </h2>

            </div>

        </div>

        <!-- Desktop -->

        <div
            id="eventsDesktop"
            class="hidden md:grid grid-cols-3 gap-6">

        </div>

        <!-- Mobile -->

        <div
            id="eventsMobile"
            class="grid grid-cols-2 gap-4 md:hidden">

        </div>

        <div class="text-center mt-10 md:hidden">

            <button
                id="showMoreEvents"
                class="hidden border border-[#F5C400] text-[#F5C400] px-6 py-3 rounded-full font-semibold hover:bg-[#F5C400] hover:text-black transition">

                View all events

            </button>

        </div>

    </div>

</section>
<!-- =======================================================
WALL OF TRUST
======================================================= -->

<section id="wall-of-trust" class="bg-black py-24">

    <div class="max-w-7xl mx-auto px-6">

        <!-- Heading -->

        <div class="text-center mb-16">

            <span class="uppercase tracking-[5px] text-[#F5C400] text-sm font-semibold">

                Recognition

            </span>

            <h2 class="mt-4 text-4xl md:text-6xl font-black text-white">

                Trusted & Recognized

            </h2>

            <p class="mt-6 max-w-3xl mx-auto text-zinc-400">

                Public recognition, official credits, social media mentions and
                testimonials from artists, production companies and organizations.

            </p>

        </div>

        <!-- ==========================
             DESKTOP
        =========================== -->

        <div class="hidden lg:grid grid-cols-12 gap-8">

            <!-- Main Recognition -->

            <div
                class="col-span-7 rounded-3xl bg-zinc-900 border border-zinc-800 overflow-hidden">

                <div id="trustViewer">

                    <!-- Filled dynamically -->

                </div>

            </div>

            <!-- Gallery -->

            <div class="col-span-5">

                <div
                    id="trustGallery"
                    class="grid grid-cols-2 gap-4">

                    <!-- Filled dynamically -->

                </div>

            </div>

        </div>

        <!-- ==========================
             MOBILE
        =========================== -->

        <div class="lg:hidden">

            <div
                id="trustMobile"
                class="space-y-5">

                <!-- Filled dynamically -->

            </div>

        </div>

    </div>

</section>
